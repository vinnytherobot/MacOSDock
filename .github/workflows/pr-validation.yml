name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome linter
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Compile GSettings schemas
        run: glib-compile-schemas schemas/

  pr-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Check PR has description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const minLength = 20;
            if (body.trim().length < minLength) {
              core.setFailed(`PR description is too short (${body.trim().length} chars). Minimum: ${minLength} chars.`);
            }

      - name: Check PR has type label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const validTypes = ['Bug fix', 'New feature', 'Breaking change', 'Refactor', 'Documentation update', 'CI/CD or build configuration change'];
            const hasType = validTypes.some(type => body.includes(`- [x] ${type}`));
            if (!hasType) {
              core.setFailed('PR must have at least one "Type of Change" checkbox selected.');
            }

  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check version bump
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const packageChanged = files.some(f => f.filename === 'package.json');
            const metadataChanged = files.some(f => f.filename === 'metadata.json');

            if (packageChanged && !metadataChanged) {
              core.warning('package.json was changed but metadata.json was not. Consider updating the version in metadata.json.');
            }
            if (metadataChanged && !packageChanged) {
              core.warning('metadata.json was changed but package.json was not. Consider updating the version in package.json.');
            }
